<!-- js_app.html: callServer, router (google.script.history), state/session, util (escapeHtml, formatThaiDate) -->
<script>
  // ---------- เรียก server ----------

  /**
   * เรียก public API ฝั่ง server คืน Promise ของ data (reject เป็น Error ข้อความภาษาไทย)
   */
  function callServer(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(res => res && res.ok ? resolve(res.data) : reject(new Error(res ? res.error : 'ไม่มีการตอบกลับ')))
        .withFailureHandler(() => reject(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่')))
        [fn](...args);
    });
  }

  // ---------- util ----------

  const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  /** escape ข้อความก่อนใส่ใน innerHTML ทุกครั้ง */
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, ch => HTML_ESCAPES[ch]);
  }

  const THAI_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const BANGKOK_OFFSET_MS = 7 * 60 * 60 * 1000; // ไทยไม่มี daylight saving

  /**
   * แปลง ISO string เป็นวันที่ไทย พ.ศ. ตามเวลา Asia/Bangkok (ไม่ขึ้นกับเขตเวลาของเครื่องผู้ใช้)
   * formatThaiDate('2026-11-03T13:20:00+07:00') → '3 พ.ย. 2569'
   * formatThaiDate(..., { withTime: true }) → '3 พ.ย. 2569 13:20 น.'
   */
  function formatThaiDate(value, options) {
    if (!value) return '';
    const date = value instanceof Date ? value : new Date(value);
    if (isNaN(date.getTime())) return '';
    const bkk = new Date(date.getTime() + BANGKOK_OFFSET_MS);
    let text = bkk.getUTCDate() + ' ' + THAI_MONTHS_SHORT[bkk.getUTCMonth()] + ' ' + (bkk.getUTCFullYear() + 543);
    if (options && options.withTime) {
      const pad = n => String(n).padStart(2, '0');
      text += ' ' + pad(bkk.getUTCHours()) + ':' + pad(bkk.getUTCMinutes()) + ' น.';
    }
    return text;
  }

  /** จำนวนวันจากวันนี้ถึงวันที่ value ตามเวลาไทย (วันนี้ = 0, เมื่อวาน = -1) */
  function daysUntil(value, now) {
    const toDay = v => Math.floor((new Date(v).getTime() + BANGKOK_OFFSET_MS) / 86400000);
    return toDay(value) - toDay(now || new Date());
  }

  /** ตอนนี้อยู่ในช่วง open_date – close_date ของรอบกิจกรรมหรือไม่ */
  function isRegistrationOpen(event, now) {
    if (!event || !event.open_date || !event.close_date) return false;
    const t = (now || new Date()).getTime();
    return t >= new Date(event.open_date).getTime() && t <= new Date(event.close_date).getTime();
  }

  // ---------- state + session ----------

  const SESSION_STORAGE_KEY = 'rp_session';

  /** ค่าจาก server (getClientConfig_ ใน config.gs): orgName, contact, statusLabels, fileKinds, requiredFiles, maxFileMb, isOwner */
  let appConfig = {};

  const appState = {
    session: null,          // { token, email, role, name } หลังล็อกอิน
    registrationOpen: false, // คำนวณจาก appConfig.currentEvent ตอนเริ่ม (server ตรวจซ้ำตอนส่งงาน)
    route: null
  };

  function loadSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
      appState.session = raw ? JSON.parse(raw) : null;
    } catch (e) {
      appState.session = null;
    }
  }

  function setSession(session) {
    appState.session = session;
    try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (e) {}
    renderChrome();
  }

  function clearSession() {
    appState.session = null;
    try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
    renderChrome();
  }

  function hasRole(roles) {
    return !roles || Boolean(appState.session && roles.indexOf(appState.session.role) !== -1);
  }

  function canAccess(route) {
    return hasRole(route.roles) || Boolean(route.allowOwner && appConfig.isOwner);
  }

  // ---------- route + เมนู (ดู docs/DESIGN.md ข้อ 5) ----------

  /** roles: null = ทุกคน / allowOwner: เปิดได้เมื่อเจ้าของสคริปต์เปิดหน้าเว็บ (เช่น Test deployment) */
  const ROUTES = {
    home:       { title: 'หน้าหลัก', roles: null },
    timeline:   { title: 'Timeline', roles: null },
    news:       { title: 'ข่าวประชาสัมพันธ์', roles: null },
    documents:  { title: 'ดาวน์โหลดเอกสาร', roles: null },
    videos:     { title: 'วิดีโอการสอน', roles: null },
    register:   { title: 'ลงทะเบียนนำเสนอ', roles: null },
    track:      { title: 'ติดตามสถานะ', roles: null },
    login:      { title: 'เข้าสู่ระบบ', roles: null },
    privacy:    { title: 'ประกาศความเป็นส่วนตัว', roles: null },
    library:    { title: 'คลังงานวิจัย', roles: ['teacher', 'admin'] },
    teacher:    { title: 'ส่งงานวิจัย / งานของฉัน', roles: ['teacher'] },
    admin:      { title: 'จัดการระบบ', roles: ['reviewer', 'admin'] },
    styleguide: { title: 'Styleguide', roles: ['admin'], allowOwner: true }
  };

  const NAV_ROUTES = ['home', 'timeline', 'news', 'documents', 'videos', 'library'];
  const USER_MENU_ROUTES = ['teacher', 'admin'];

  /** หน้าที่ลงทะเบียนจาก page_*.html: { render(container, params) } */
  const pages = {};
  let renderSeq = 0;

  /**
   * ลงทะเบียนหน้า เรียกจาก page_*.html
   * registerPage('home', { render(container, params) { ... } })
   */
  function registerPage(name, page) {
    pages[name] = page;
  }

  /** clone <template id="tpl-xxx"> ของหน้า */
  function cloneTemplate(id) {
    const tpl = document.getElementById(id);
    return tpl ? tpl.content.cloneNode(true) : document.createDocumentFragment();
  }

  function toQuery(state) {
    const query = {};
    Object.keys(state).forEach(key => {
      if (state[key] !== undefined && state[key] !== null && state[key] !== '') query[key] = String(state[key]);
    });
    return query;
  }

  /**
   * เปลี่ยนหน้าโดยไม่ reload: navigate('news', { id: 'NEWS-xxxx' })
   */
  function navigate(page, params, options) {
    const state = Object.assign({}, params || {}, { page: page });
    const history = window.google && google.script && google.script.history;
    if (history) {
      if (options && options.replace) history.replace(state, toQuery(state));
      else history.push(state, toQuery(state));
    }
    renderRoute(state);
  }

  function renderRoute(state) {
    const params = Object.assign({}, state || {});
    const name = ROUTES[params.page] ? params.page : 'home';
    const route = ROUTES[name];

    closeMobileMenu();
    if (!canAccess(route)) {
      if (!appState.session) {
        navigate('login', { next: name }, { replace: true });
        return;
      }
      appState.route = name;
      renderChrome();
      renderMessage('คุณไม่มีสิทธิ์เข้าถึงหน้านี้', 'กลับไปหน้าหลักหรือเข้าสู่ระบบด้วยบัญชีอื่น');
      return;
    }

    appState.route = name;
    renderChrome();

    const container = document.getElementById('app');
    const seq = ++renderSeq;
    container.innerHTML = '';
    window.scrollTo(0, 0);

    const page = pages[name];
    if (!page) {
      renderMessage(route.title, 'หน้านี้อยู่ระหว่างพัฒนา');
      refreshIcons();
      return;
    }

    Promise.resolve()
      .then(() => page.render(container, params, () => seq === renderSeq))
      .then(() => { if (seq === renderSeq) refreshIcons(); })
      .catch(err => {
        if (seq !== renderSeq) return;
        console.error(err);
        renderMessage('เกิดข้อผิดพลาด', err && err.message ? err.message : 'กรุณาลองใหม่อีกครั้ง');
      });
  }

  /** ข้อความกลางหน้าแบบง่าย (empty/error state เต็มรูปแบบอยู่ใน js_ui.html เฟส 0.5) */
  function renderMessage(title, detail) {
    const container = document.getElementById('app');
    container.innerHTML =
      '<section class="container-content section text-center">' +
        '<h1 class="heading-2">' + escapeHtml(title) + '</h1>' +
        '<p class="mt-2 text-ink-muted">' + escapeHtml(detail) + '</p>' +
        '<a href="#" data-route="home" class="btn-secondary mt-6">กลับหน้าหลัก</a>' +
      '</section>';
  }

  function refreshIcons() {
    if (window.lucide) lucide.createIcons();
  }

  // ---------- header: เมนูหลัก + เมนูผู้ใช้ ----------

  const NAV_LINK_CLASS = 'inline-flex w-full items-center whitespace-nowrap min-h-[44px] px-3 rounded-md text-navy-100 hover:text-white hover:bg-navy-700';
  const NAV_LINK_ACTIVE_CLASS = 'inline-flex w-full items-center whitespace-nowrap min-h-[44px] px-3 rounded-md text-white bg-navy-700 font-medium';

  function navLinkHtml(name, label) {
    const active = appState.route === name;
    return '<a href="#" data-route="' + name + '" class="' + (active ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS) + '"' +
      (active ? ' aria-current="page"' : '') + '>' + escapeHtml(label || ROUTES[name].title) + '</a>';
  }

  function userRoutes() {
    return USER_MENU_ROUTES.filter(name => hasRole(ROUTES[name].roles));
  }

  function renderChrome() {
    const navItems = NAV_ROUTES
      .filter(name => hasRole(ROUTES[name].roles))
      .map(name => '<li>' + navLinkHtml(name) + '</li>')
      .join('');
    document.getElementById('nav-list').innerHTML = navItems;
    document.getElementById('mobile-nav-list').innerHTML = navItems;

    const registerHtml = appState.registrationOpen
      ? '<a href="#" data-route="register" class="btn-primary whitespace-nowrap">ลงทะเบียนนำเสนอ</a>'
      : '';
    const session = appState.session;
    const displayName = session ? (session.name || session.email) : '';

    // จอกว้าง: ปุ่มลงทะเบียน + เมนูผู้ใช้แบบ dropdown
    let desktop = registerHtml;
    if (session) {
      desktop +=
        '<div class="relative">' +
          // 1280–1535px เมนูหลักแนวนอนกินที่ แสดงแค่ไอคอน (ชื่ออยู่ใน aria-label และในแผงเมนู)
          '<button type="button" id="user-menu-toggle" class="btn-on-dark max-w-[180px]" aria-expanded="false" aria-controls="user-menu-panel" aria-label="เมนูผู้ใช้: ' + escapeHtml(displayName) + '">' +
            '<i data-lucide="circle-user" aria-hidden="true"></i><span class="truncate xl:hidden 2xl:inline">' + escapeHtml(displayName) + '</span>' +
          '</button>' +
          '<div id="user-menu-panel" class="card absolute right-0 top-full mt-2 w-56 p-2 text-ink shadow-md" hidden>' +
            '<p class="truncate px-4 py-2 text-sm text-ink-muted">' + escapeHtml(displayName) + '</p>' +
            userRoutes().map(name => '<a href="#" data-route="' + name + '" class="btn-ghost w-full justify-start">' + escapeHtml(ROUTES[name].title) + '</a>').join('') +
            '<button type="button" data-action="logout" class="btn-ghost w-full justify-start">ออกจากระบบ</button>' +
          '</div>' +
        '</div>';
    } else {
      desktop += '<a href="#" data-route="login" class="btn-on-dark">เข้าสู่ระบบ</a>';
    }
    document.getElementById('header-actions').innerHTML = desktop;

    // มือถือ: ต่อท้ายรายการเมนูในแผงเต็มจอ
    let mobile = registerHtml;
    if (session) {
      mobile += '<p class="px-3 text-sm text-navy-100">เข้าสู่ระบบในชื่อ <span class="font-medium text-white">' + escapeHtml(displayName) + '</span></p>';
      mobile += userRoutes().map(name => navLinkHtml(name)).join('');
      mobile += '<button type="button" data-action="logout" class="' + NAV_LINK_CLASS + '">ออกจากระบบ</button>';
    } else {
      mobile += navLinkHtml('login');
    }
    document.getElementById('mobile-actions').innerHTML = mobile;
    refreshIcons();
  }

  // ---------- เมนูมือถือ + เมนูผู้ใช้ ----------

  function setMenuIcon(button, name) {
    button.innerHTML = '<i data-lucide="' + name + '" aria-hidden="true"></i>';
    refreshIcons();
  }

  function openMobileMenu() {
    const toggle = document.getElementById('menu-toggle');
    document.getElementById('mobile-menu').hidden = false;
    document.body.classList.add('overflow-hidden');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'ปิดเมนู');
    setMenuIcon(toggle, 'x');
  }

  function closeMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    if (!menu || menu.hidden) return;
    const toggle = document.getElementById('menu-toggle');
    menu.hidden = true;
    document.body.classList.remove('overflow-hidden');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'เปิดเมนู');
    setMenuIcon(toggle, 'menu');
  }

  function setUserMenuOpen(open) {
    const toggle = document.getElementById('user-menu-toggle');
    const panel = document.getElementById('user-menu-panel');
    if (!toggle || !panel) return;
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
  }

  // ---------- เริ่มทำงาน ----------

  /** อ่าน JSON จาก data-attribute ของ <body> (ค่าที่ doGet ฝังไว้) */
  function readBodyJson(key) {
    try {
      const value = JSON.parse(document.body.dataset[key] || '{}');
      return value && typeof value === 'object' ? value : {};
    } catch (e) {
      return {};
    }
  }

  /** <a data-route="news" data-param-id="NEWS-..."> → { id: 'NEWS-...' } */
  function routeParamsFrom(element) {
    const params = {};
    Object.keys(element.dataset).forEach(key => {
      if (key.indexOf('param') === 0 && key.length > 5) {
        params[key.charAt(5).toLowerCase() + key.slice(6)] = element.dataset[key];
      }
    });
    return params;
  }

  function startApp() {
    appConfig = readBodyJson('config');
    appState.registrationOpen = isRegistrationOpen(appConfig.currentEvent);
    loadSession();

    document.addEventListener('click', event => {
      const userToggle = event.target.closest('#user-menu-toggle');
      setUserMenuOpen(Boolean(userToggle) && userToggle.getAttribute('aria-expanded') !== 'true');

      const link = event.target.closest('[data-route]');
      if (link) {
        event.preventDefault();
        navigate(link.dataset.route, routeParamsFrom(link));
        return;
      }
      if (event.target.closest('#menu-toggle')) {
        if (document.getElementById('mobile-menu').hidden) openMobileMenu();
        else closeMobileMenu();
        return;
      }
      if (event.target.closest('[data-action="logout"]')) {
        // เฟส 4: เรียก callServer('logout', token) ก่อนล้าง session
        clearSession();
        navigate('home');
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      const menu = document.getElementById('mobile-menu');
      if (!menu.hidden) {
        closeMobileMenu();
        document.getElementById('menu-toggle').focus();
      }
      setUserMenuOpen(false);
    });

    // ขยายจอจนเห็นเมนูแนวนอน (xl) แล้ว ปิดเมนูมือถือที่ค้างอยู่
    window.matchMedia('(min-width: 1280px)').addEventListener('change', event => {
      if (event.matches) closeMobileMenu();
    });

    const history = window.google && google.script && google.script.history;
    if (history) {
      history.setChangeHandler(e => renderRoute(e.state || e.location.parameter));
    }

    const initial = readBodyJson('params');
    navigate(initial.page || 'home', initial, { replace: true });
  }
</script>
