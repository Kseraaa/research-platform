<!-- js_upload.html: อ่านไฟล์เป็น base64, อัปโหลดทีละไฟล์พร้อม progress และลองใหม่อัตโนมัติ 2 ครั้ง
     ใช้ร่วมกันระหว่างหน้าลงทะเบียน (เฟส 2), ส่งงานครู (เฟส 4) และส่งฉบับแก้ไข (เฟส 3) -->
<script>
  const UPLOAD_RETRIES = 2;
  const UPLOAD_RETRY_DELAY_MS = 1500;

  /** File → base64 (ไม่มี prefix data:...;base64,) รายงานความคืบหน้าการอ่าน 0–1 */
  function readFileAsBase64(file, onProgress) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ กรุณาเลือกไฟล์ใหม่'));
      reader.readAsDataURL(file);
    });
  }

  /**
   * ดาวน์โหลดไฟล์งานวิจัยผ่าน getFileForViewer (ไฟล์ไม่ได้แชร์ใน Drive) ใช้กับปุ่ม data-file-id
   * token: session token หรือ track token
   */
  function downloadSubmissionFile(token, fileId, button) {
    if (button) setButtonLoading(button, true, 'กำลังเตรียมไฟล์...');
    return callServer('getFileForViewer', token, fileId).then(file => {
      const bytes = Uint8Array.from(atob(file.base64), c => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: file.mime_type }));
      const link = document.createElement('a');
      link.href = url;
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }).catch(err => {
      toast(err.message, 'danger');
    }).finally(() => {
      if (button) setButtonLoading(button, false);
    });
  }

  /** เรียก fn() ซ้ำเมื่อเชื่อมต่อล้มเหลว (ไม่ลองซ้ำเมื่อ server ปฏิเสธด้วยเหตุผลที่ชัดเจน เช่น ชนิดไฟล์ผิด) */
  function withRetry(fn, retries) {
    return fn().catch(err => {
      const isNetwork = err && err.message === 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่';
      if (!isNetwork || retries <= 0) throw err;
      return new Promise(resolve => setTimeout(resolve, UPLOAD_RETRY_DELAY_MS)).then(() => withRetry(fn, retries - 1));
    });
  }

  /**
   * อัปโหลด 1 ไฟล์ แสดงความคืบหน้าบน dropzone
   * google.script.run ไม่มี progress event จริง: 0–30% = อ่านไฟล์, 30–90% = ค่อยๆ เพิ่มระหว่างรอ server, 100% = สำเร็จ
   */
  function uploadOneFile(o) {
    const dz = o.dropzone;
    const file = dz.getFile();
    let percent = 0;
    const show = p => { percent = p; dz.setUploading(p); };
    show(0);

    return readFileAsBase64(file, ratio => show(ratio * 30)).then(base64 => {
      show(30);
      const timer = setInterval(() => show(Math.min(90, percent + (90 - percent) * 0.08)), 400);
      return withRetry(() => callServer(o.uploadFn || 'uploadFile', o.submissionId, o.uploadKey, o.fileKind, file.name, file.type, base64), UPLOAD_RETRIES)
        .finally(() => clearInterval(timer));
    }).then(result => {
      dz.setSuccess();
      return result;
    }, err => {
      dz.setError(err.message);
      throw err;
    });
  }

  /**
   * flow ส่งงานทั้งหมด: สร้างงาน (ครั้งเดียว) → อัปโหลดไฟล์ที่ยังไม่สำเร็จ → finalize
   * กดส่งซ้ำหลังล้มเหลวได้: ไม่สร้างงานซ้ำ ไม่ส่งไฟล์ที่สำเร็จแล้วซ้ำ เตือนก่อนปิดแท็บระหว่างส่ง
   * @param {{ state: { submission, done }, create: () => Promise<{ submissionId, uploadKey }>, items: { fileKind, dropzone }[], onCreated? }} o
   * @return Promise<{ submissionId, email }> ผลจาก finalizeSubmission
   */
  function runSubmissionUpload(o) {
    const warn = event => { event.preventDefault(); event.returnValue = ''; };
    window.addEventListener('beforeunload', warn);
    const created = o.state.submission
      ? Promise.resolve(o.state.submission)
      : o.create().then(submission => {
          o.state.submission = submission;
          if (o.onCreated) o.onCreated(submission);
          return submission;
        });
    return created
      .then(s => uploadFilesInOrder({ submissionId: s.submissionId, uploadKey: s.uploadKey, items: o.items, done: o.state.done }))
      .then(() => callServer('finalizeSubmission', o.state.submission.submissionId, o.state.submission.uploadKey))
      .finally(() => window.removeEventListener('beforeunload', warn));
  }

  /**
   * อัปโหลดหลายไฟล์ตามลำดับ ข้ามไฟล์ที่สำเร็จแล้ว (ใน done) เพื่อให้กดลองใหม่ได้โดยไม่ส่งซ้ำ
   * @param {{ submissionId, uploadKey, items: { fileKind, dropzone }[], done: Object, uploadFn? }} o
   *   uploadFn: ฟังก์ชันฝั่ง server (ค่าเริ่มต้น 'uploadFile') อาร์กิวเมนต์แรกคือ submissionId
   *   ส่งฉบับแก้ไขใช้ uploadFn = 'uploadRevisionFile' และส่ง track token แทน submissionId
   */
  function uploadFilesInOrder(o) {
    return o.items.reduce((chain, item) => chain.then(() => {
      if (o.done[item.fileKind]) return null;
      return uploadOneFile({ submissionId: o.submissionId, uploadKey: o.uploadKey, fileKind: item.fileKind, dropzone: item.dropzone, uploadFn: o.uploadFn })
        .then(result => { o.done[item.fileKind] = result; });
    }), Promise.resolve());
  }
</script>
