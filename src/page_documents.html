<!-- page_documents.html: ศูนย์ดาวน์โหลดเอกสาร (โครงจาก mountFilterableList: ค้นหาใน hero + sidebar ตัวกรอง + grid การ์ด + pagination / มือถือ: ตัวกรองใน drawer) -->
<script>
  registerPage('documents', {
    render(container, params, isCurrent) {
      return mountFilterableList(container, {
        hero: { title: 'ดาวน์โหลดเอกสาร', description: 'แบบฟอร์ม คู่มือ ตัวอย่างรายงานผลการวิจัย และเทมเพลตสำหรับครู' },
        search: { id: 'doc-search', label: 'ค้นหาเอกสาร', placeholder: 'ค้นหาจากชื่อเอกสารหรือผู้จัดทำ' },
        filterNames: ['category', 'year'],
        fetch: state => callServer('getDocuments', state),
        filterGroups: result => [
          {
            name: 'category', label: 'หมวดหมู่', type: 'radio', allLabel: 'ทั้งหมด',
            allCount: result.categories.reduce((sum, c) => sum + c.count, 0),
            options: result.categories.map(c => ({ value: c.category_id, label: c.name, count: c.count }))
          },
          { name: 'year', label: 'ปีการศึกษา', type: 'select', allLabel: 'ทุกปี', options: result.years.map(y => ({ value: String(y), label: String(y) })) }
        ],
        renderItems: items => items.map(renderDocumentCard).join(''),
        emptyFiltered: { icon: 'search-x', title: 'ไม่พบเอกสารที่ค้นหา', message: 'ลองเปลี่ยนคำค้นหรือล้างตัวกรอง' },
        emptyAll: { icon: 'folder-open', title: 'ยังไม่มีเอกสารให้ดาวน์โหลด', message: 'เอกสารจะแสดงที่นี่เมื่อแอดมินเพิ่มเข้ามา' },
        isCurrent: isCurrent
      });
    }
  });
</script>
