<!-- page_privacy.html: ประกาศความเป็นส่วนตัว (PDPA) ลิงก์จาก footer และ modal ในหน้าลงทะเบียน
     เนื้อหาเป็นฉบับตั้งต้น ให้ผู้รับผิดชอบด้านข้อมูลส่วนบุคคลของโรงเรียนตรวจ/แก้ก่อนใช้งานจริง (ค่าตัวเลขอยู่ที่ PRIVACY_NOTICE ใน config.gs) -->
<script>
  /** เนื้อหาประกาศความเป็นส่วนตัว (HTML ที่ escape แล้ว) ใช้ทั้งหน้า privacy และ modal ในฟอร์มลงทะเบียน */
  function renderPrivacyNoticeHtml() {
    const org = (appConfig.orgName || '') + ' ' + (appConfig.schoolName || '');
    const contact = appConfig.contact || {};
    const privacy = appConfig.privacy || {};
    const section = (title, body) => '<section><h2 class="heading-3">' + escapeHtml(title) + '</h2><div class="mt-2 flex flex-col gap-2">' + body + '</div></section>';
    const list = items => '<ul class="list-disc pl-6">' + items.map(i => '<li>' + escapeHtml(i) + '</li>').join('') + '</ul>';
    return '<div class="flex flex-col gap-6 text-body">' +
      '<p>' + escapeHtml(org) + ' ("หน่วยงาน") ให้ความสำคัญกับการคุ้มครองข้อมูลส่วนบุคคลตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 ' +
        'ประกาศนี้อธิบายว่าเราเก็บ ใช้ และดูแลข้อมูลของคุณอย่างไรเมื่อใช้เว็บไซต์นี้</p>' +
      section('ข้อมูลที่เราเก็บ', list([
        'ผู้ลงทะเบียนนำเสนอผลงาน: ชื่อ-นามสกุล อีเมล เบอร์โทร หน่วยงาน/สถานศึกษา รายชื่อผู้ร่วมวิจัย และไฟล์ผลงาน',
        'ครูที่ส่งงานวิจัย: อีเมลของโรงเรียน ชื่อ-นามสกุล รายชื่อผู้วิจัย บทคัดย่อ และไฟล์งานวิจัย',
        'ผู้ใช้ที่เข้าสู่ระบบ: อีเมลและรหัสผ่านครั้งเดียว (OTP) ซึ่งเก็บแบบเข้ารหัสและหมดอายุใน 10 นาที',
        'บันทึกการส่งอีเมลแจ้งสถานะ (ผู้รับ เวลา ผลการส่ง)'
      ])) +
      section('วัตถุประสงค์', list([
        'พิจารณาผลงานและจัดกิจกรรมนำเสนอผลงานวิจัย',
        'ติดต่อกลับและแจ้งสถานะผลงานทางอีเมล',
        'เผยแพร่ผลงานในคลังงานวิจัยของโรงเรียน เฉพาะเมื่อคุณเลือก "อนุญาตเผยแพร่" (แสดงชื่อเรื่อง ผู้วิจัย หน่วยงาน บทคัดย่อ และไฟล์ ไม่แสดงอีเมลหรือเบอร์โทร)',
        'สรุปสถิติการจัดกิจกรรม'
      ])) +
      section('ผู้ที่เข้าถึงข้อมูล', list([
        'ผู้ตรวจผลงานเข้าถึงข้อมูลผลงาน แต่ไม่เห็นอีเมลและเบอร์โทรของคุณ',
        'ผู้ดูแลระบบเข้าถึงข้อมูลทั้งหมดเท่าที่จำเป็นต่อการจัดกิจกรรม',
        'ข้อมูลจัดเก็บบน Google Workspace ของโรงเรียน และส่งอีเมลผ่านผู้ให้บริการ Resend ซึ่งอาจประมวลผลข้อมูลนอกประเทศไทย',
        'เราไม่ขายหรือเปิดเผยข้อมูลของคุณให้บุคคลภายนอกเพื่อการตลาด'
      ])) +
      section('ระยะเวลาเก็บรักษา', '<p>เก็บไว้ไม่เกิน ' + escapeHtml(privacy.retentionYears || 5) + ' ปีนับจากวันที่ส่งผลงาน หรือจนกว่าคุณขอให้ลบ ' +
        'ยกเว้นผลงานที่เผยแพร่ในคลังงานวิจัยซึ่งเก็บไว้เพื่อการศึกษาจนกว่าคุณจะขอถอนการเผยแพร่ ' +
        'งานที่เริ่มส่งแต่ไม่ส่งให้เสร็จจะถูกลบอัตโนมัติภายใน 24 ชั่วโมง</p>') +
      section('สิทธิของคุณ', list([
        'ขอเข้าถึงหรือขอสำเนาข้อมูลของคุณ',
        'ขอแก้ไขข้อมูลให้ถูกต้อง',
        'ขอลบข้อมูล หรือขอถอนการเผยแพร่ในคลังงานวิจัย',
        'ถอนความยินยอมได้ทุกเมื่อ (ไม่กระทบการประมวลผลที่ทำไปก่อนหน้า)',
        'ร้องเรียนต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.)'
      ])) +
      section('ติดต่อเรา', '<p>' + escapeHtml(org) + '<br>' + escapeHtml(contact.address || '') + '<br>' +
        'โทร ' + escapeHtml(contact.phone || '') + ' · อีเมล ' + escapeHtml(contact.email || '') + '</p>') +
      '<p class="text-meta">ปรับปรุงล่าสุด ' + escapeHtml(formatThaiDate(privacy.updatedAt)) + '</p>' +
    '</div>';
  }

  registerPage('privacy', {
    render(container) {
      container.innerHTML = renderPageHero({ title: 'ประกาศความเป็นส่วนตัว', description: 'การเก็บ ใช้ และคุ้มครองข้อมูลส่วนบุคคลของผู้ใช้เว็บไซต์' }) +
        '<section class="container-content section"><article class="card mx-auto max-w-3xl p-6 md:p-10">' + renderPrivacyNoticeHtml() + '</article></section>';
    }
  });
</script>
